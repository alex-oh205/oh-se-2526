<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Demo 1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
            crossorigin="anonymous">
    <link href="weather.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
            crossorigin="anonymous"></script>
    <script src="weather.js" defer></script>
</head>

<body>
    <div class="container w-25">
        <table class="table table-hover">
            <thead class="table-light">
              <tr>
                <th class = "key" scope="col">Key</th>
                <th class = "value" scope="col">Value</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th class = "key"  scope="row">Temperature</th>
                <td class = "value"  id="temperature"></td>
              </tr>
              <tr>
                <th class = "key"  scope="row">Humidity</th>
                <td class = "value"  id="humidity"></td>
              </tr>
              <tr>
                <th class = "key"  scope="row">Atmospher Pressure</th>
                <td class = "value"  id="pressure"></td>
              </tr>
              <tr>
                <th class = "key"  scope="row">Wind Speed</th>
                <td class = "value"  id="windSpeed"></td>
              </tr>
              <tr>
                <th class = "key"  scope="row">Cloudiness</th>
                <td class = "value"  id="rain"></td>
              </tr>
              <tr>
                <th class = "key"  scope="row">Weather</th>
                <td class = "value"  id="weather"></td>
              </tr>
            </tbody>
          </table>
    </div>
    
</body>
</html>
