<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Demo 2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
            rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
            crossorigin="anonymous">
    <link href="covid19.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
            crossorigin="anonymous"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="covid19.js" defer></script>
</head>

<body>
    <div class="container w-25 covid-table">
        <table class="table table-hover table-sm table-light">
            <thead class="table-dark">
              <tr>
                <th class = "state" scope="col">State</th>
                <th class = "positives" scope="col">COVID-19 Positive Cases (6/13/20)</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
    </div>
    <div class="chart">
      <div class="container d-flex overflow-hidden bg-light rounded-4" id="chart-wrapper">
        <canvas id="covidChart"></canvas>
      </div>
      <div class="container p-0">
        <div class="row row-cols-1 row-cols-md-2">
          <div class="col">
            <div class="card my-4 rounded-4 stats">
              <div class="card-body">
                <p class="card-text" id="averageCases"></p>
              </div>
            </div>
          </div>
          <div class="col">
            <div class="card my-4 rounded-4 stats">
              <div class="card-body">
                <p class="card-text" id="averageHospitalized"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
</body>
</html>
