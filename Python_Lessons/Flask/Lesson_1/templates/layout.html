<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- If a title is passed as a parameter, use that, otherwise use the default -->
    {% if title %}
        <title>Flask Tutorial - {{ title }}</title>
    {% else %}
        <title>Flask Tutorial</title>
    {% endif %}

    <!-- Bootstrap 5 CSS, Icons and custom CSS file links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
            rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
            crossorigin="anonymous">

    <!-- Update custom style sheet link with:  {{url_for('static', filename='pathToFile')}}-->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
            crossorigin="anonymous"></script>
</head>

<body class="body">
    <div class="container-lg">
        
        <!-- Navbar -->
        <header>{% include 'includes/_navigation.html' %}</header>

        <!-- Page Content -->
        {% block index_overview %} {% endblock index_overview %}
        {% block about %} {% endblock about %}
        
        <!-- Footer -->
        {% include 'includes/_footer.html' %}
    
    </div> <!-- Closing tag for outermost container -->
    
</body>
</html>
